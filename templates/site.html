<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%234285f4' fill-opacity='.25'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234285f4'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fbf7f0;
  --bg-soft: #f3ece0;
  --card: #fffdf9;
  --ink: #1f1c18;
  --muted: #6d655a;
  --rule: #e4dac9;
  --dot: #3b7cf5;
  --dot-halo: rgba(59, 124, 245, .22);
  --warm: #e8603c;
  --warm-soft: rgba(232, 96, 60, .12);
  --sun: #f2b53a;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 8px 24px -12px rgba(60, 40, 20, .18);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b;
    --bg-soft: #1c1f25;
    --card: #1e2128;
    --ink: #ece7de;
    --muted: #a39b8f;
    --rule: #2f333b;
    --dot: #6ea0ff;
    --dot-halo: rgba(110, 160, 255, .22);
    --warm: #ff8a65;
    --warm-soft: rgba(255, 138, 101, .14);
    --sun: #f5c65b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  --bg: #15171b;
  --bg-soft: #1c1f25;
  --card: #1e2128;
  --ink: #ece7de;
  --muted: #a39b8f;
  --rule: #2f333b;
  --dot: #6ea0ff;
  --dot-halo: rgba(110, 160, 255, .22);
  --warm: #ff8a65;
  --warm-soft: rgba(255, 138, 101, .14);
  --sun: #f5c65b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 var(--sans);
  transition: background-color .3s, color .3s;
}
a {
  color: inherit;
  text-decoration: none;
  background: linear-gradient(var(--warm), var(--warm)) 0 100% / 100% 2px no-repeat;
  transition: background-size .2s, color .2s;
}
a:hover { color: var(--warm); background-size: 100% 100%; background-image: linear-gradient(var(--warm-soft), var(--warm-soft)); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--dot); outline-offset: 3px; border-radius: 4px; }
code { font: .88em var(--mono); background: var(--bg-soft); padding: .1em .35em; border-radius: 4px; }
time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; white-space: nowrap; }

.wrap { max-width: 50rem; margin: 0 auto; padding: 0 16px; }

/* ---------- hero ---------- */
.hero { padding: 4.5rem 0 2.5rem; position: relative; }
.hero h1 {
  font: 600 clamp(2.4rem, 8vw, 4rem)/1.05 var(--serif);
  letter-spacing: -.02em;
  margin: 0 0 .6rem;
  display: flex; align-items: center; gap: .9rem;
}
.dot {
  position: relative; flex: none;
  width: .42em; height: .42em; border-radius: 50%;
  background: var(--dot);
  box-shadow: 0 0 0 .07em var(--card), 0 1px 4px rgba(0,0,0,.25);
}
.dot::before {
  content: ""; position: absolute; inset: -.5em; border-radius: 50%;
  background: var(--dot-halo);
  animation: ping 2.8s ease-out infinite;
}
@keyframes ping {
  0% { transform: scale(.3); opacity: 1; }
  80%, 100% { transform: scale(1.4); opacity: 0; }
}
.headline { font-size: clamp(1.1rem, 3.2vw, 1.3rem); color: var(--muted); margin: 0 0 1.4rem; }
.contact { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; }
.chip, .loc {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .35rem .8rem; border-radius: 999px;
  font-size: .9rem; border: 1px solid var(--rule); background: var(--card);
}
.chip { background-image: none; transition: transform .15s, border-color .15s, color .15s; }
.chip:hover { transform: translateY(-2px); border-color: var(--warm); background: var(--card); }
.loc { color: var(--muted); }

.theme {
  position: absolute; top: 1.2rem; right: 0;
  width: 2.4rem; height: 2.4rem; border-radius: 50%;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink);
  cursor: pointer; display: grid; place-items: center;
  transition: transform .3s;
}
.theme:hover { transform: rotate(25deg); }
.theme svg { width: 1.2rem; height: 1.2rem; }
.theme .moon { display: none; }
:root[data-theme="dark"] .theme .sun { display: none; }
:root[data-theme="dark"] .theme .moon { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme .sun { display: none; }
  :root:not([data-theme="light"]) .theme .moon { display: block; }
}

/* ---------- sections ---------- */
section { padding: 1.6rem 0; }
h2 {
  font: 600 .8rem/1 var(--sans);
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--warm);
  margin: 0 0 1.2rem;
  display: flex; align-items: center; gap: .8rem;
}
h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.lede { font: 1.2rem/1.6 var(--serif); margin: 0; }
section > p { margin: 0; }

ul { margin: .5rem 0 0; padding-left: 1.1rem; }
li { margin: .3rem 0; }
li::marker { color: var(--warm); }

/* ---------- experience ---------- */
.employer + .employer { margin-top: 2rem; }
.employer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
.employer-head h3 { font: 600 1.6rem/1.2 var(--serif); margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 1.6rem; position: relative; }
.timeline::before {
  content: ""; position: absolute; left: .4rem; top: .6rem; bottom: .6rem; width: 2px;
  background: linear-gradient(var(--dot), var(--warm));
  border-radius: 2px; opacity: .5;
}
.role { position: relative; padding: .2rem 0 1.2rem; margin: 0; }
.role::before {
  content: ""; position: absolute; left: -1.6rem; top: .5rem;
  width: .9rem; height: .9rem; border-radius: 50%;
  background: var(--bg); border: 3px solid var(--dot);
  transition: background .2s, transform .2s;
}
.role:first-child::before { background: var(--dot); box-shadow: 0 0 0 5px var(--dot-halo); }
.role:hover::before { background: var(--warm); border-color: var(--warm); transform: scale(1.2); }
.role-head { display: grid; grid-template-columns: 1fr auto; column-gap: 1rem; align-items: baseline; }
.role-head h4 { font-size: 1.05rem; margin: 0; line-height: 1.35; }
.role-head .team { grid-column: 1; color: var(--muted); font-size: .95rem; }
.role-head time { grid-column: 2; grid-row: 1; }
.role li::marker { color: var(--dot); }

/* ---------- projects ---------- */
.cards { display: grid; gap: 1rem; }
.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  padding: 1.2rem 1.3rem; box-shadow: var(--shadow);
  transition: transform .2s, border-color .2s;
}
.card:hover { transform: translateY(-3px) rotate(-.25deg); border-color: var(--sun); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.card h3 { font: 600 1.3rem/1.2 var(--serif); margin: 0; }
.card .desc { margin: .2rem 0 0; color: var(--muted); }

.edu p { margin: 0; }
.edu time { margin-left: .5rem; }

footer {
  margin-top: 2rem; padding: 2rem 0 3rem; border-top: 1px solid var(--rule);
  color: var(--muted); font-size: .9rem;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .8rem;
}
footer nav { display: flex; gap: 1rem; }

/* ---------- motion ---------- */
.js .reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
.js .reveal.seen { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
  .js .reveal { opacity: 1; transform: none; }
  html { scroll-behavior: auto; }
}

@media (max-width: 560px) {
  body { font-size: 16px; }
  .hero { padding-top: 4rem; }
  .role-head { grid-template-columns: 1fr; }
  .role-head time { grid-column: 1; grid-row: auto; }
  .card-head { flex-direction: column; gap: 0; }
}

@media print {
  body { background: #fff; color: #000; font-size: 11pt; }
  .theme, footer nav, .dot::before { display: none; }
  .js .reveal { opacity: 1; transform: none; }
  .card { box-shadow: none; break-inside: avoid; }
  a { background: none; }
}
</style>
<script>
  document.documentElement.classList.add("js");
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <button class="theme" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
    <h1><span class="dot" aria-hidden="true" title="Search with My Location"></span>{{NAME}}</h1>
    <p class="headline">{{HEADLINE}}</p>
    <div class="contact">
      <span class="loc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>{{LOCATION}}</span>
      {{CONTACT}}
    </div>
  </header>

  <section class="reveal">
    <h2>Summary</h2>
    <p class="lede">{{SUMMARY}}</p>
  </section>

  <section class="reveal">
    <h2>Technical</h2>
    <p>{{TECHNICAL}}</p>
  </section>

  <section>
    <h2>Experience</h2>
    {{EXPERIENCE}}
  </section>

  <section>
    <h2>Personal Projects</h2>
    <div class="cards">{{PROJECTS}}</div>
  </section>

  <section class="reveal">
    <h2>Patents &amp; Publications</h2>
    {{PUBLICATIONS}}
  </section>

  <section class="reveal edu">
    <h2>Education</h2>
    {{EDUCATION}}
  </section>

  <section class="reveal">
    <h2>Additional</h2>
    {{ADDITIONAL}}
  </section>

  <footer>
    <span>Updated {{BUILT}}</span>
    <nav><a href="{{BASENAME}}.pdf">PDF</a><a href="{{BASENAME}}.md">Markdown</a></nav>
  </footer>
</main>
<script>
  (function () {
    var root = document.documentElement;
    document.querySelector(".theme").addEventListener("click", function () {
      var dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });

    var els = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) {
      els.forEach(function (el) { el.classList.add("seen"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("seen"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px" });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>
</body>
</html>
