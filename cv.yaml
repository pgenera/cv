summary: >-
  Infrastructure engineer with 19 years at Google as an expert at the layer where
  capacity, traffic management, and failure domains meet. 15 years as an individual
  contributor and tech lead across diverse projects such as Electronic Health Record AI
  enrichment, planet-scale network load balancing, and Google Search with My Location,
  and an additional 4 years managing small infrastructure teams while still writing and
  shipping systems code, internally and externally. Built global load balancing for the
  L7 proxy carrying most storage bits in Google Cloud, and currently responsible for the
  reliability and safety of footprint operations across Google's internal
  continuous-delivery infrastructure.

technical: >-
  Java, Python, SQL, and C++, plus a long tail of domain-specific languages, with recent
  project work in Kotlin and Go. Linux systems work: nftables, policy routing and BGP,
  docker, snapraid, tcpdump. Reverse engineering Bluetooth devices. Agentic development
  with Claude Code and Antigravity. Global and regional software load balancing.

