summary: >-
  Infrastructure engineer with nineteen years at Google. An expert at the layer where
  capacity, traffic management, and failure domains meet. Fifteen years as an individual
  contributor and tech lead across diverse projects such as Electronic Health Record AI
  enrichment, planet-scale network load balancing, and Google Search with My Location.
  An additional four years managing small infrastructure teams while still writing and
  shipping systems code, internally and externally. Built global load balancing for the
  L7 proxy carrying most storage bits in Google Cloud. Currently responsible for the
  reliability and safety of footprint operations across Google's internal
  continuous-delivery infrastructure. Carried the pager for Google Search, YouTube, and
  Google Cloud Storage; now training an oncall team in the Incident Command System.

technical: >-
  Java, Python, C++, SQL, and a long tail of DSLs; recent agentic work in Kotlin and Go
  with Claude Code and Antigravity. Global and regional software load balancing,
  networking, and Bluetooth reverse engineering.

