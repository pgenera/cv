personal_projects:
  - name: wearvian
    url: https://github.com/pgenera/wearvian
    description: Wear OS phone key for Rivian R1 vehicles
    dates: "2026"
    bullets:
      - >-
        Wear OS app that functions as a Rivian phone key over Bluetooth LE: passive
        entry and drive enable by proximity, plus lock, frunk, liftgate, window, charge
        port, and climate commands.
      - >-
        Reverse engineered and documented the vehicle's phone-key protocol: the pairing
        handshake, the authenticated ranging heartbeat that passive entry actually keys
        on rather than OS-level bonding, AES-GCM command framing, and the status stream
        that drives live lock, closure, charge, and range display.
      - >-
        Security-first design that works offline: the watch has no internet access and
        its private key never leaves it; a [companion phone
        app](https://github.com/pgenera/wearvian-companion) performs the one-time cloud
        enrollment over the Wear OS Data Layer.

  - name: Embedded systems and network services
    dates: ongoing
    bullets:
      - >-
        [mpubsub](https://github.com/pgenera/esphome-mpubsub) implements the brokerless
        pub/sub from the [defensive
        publication](https://www.tdcommons.org/dpubs_series/5601), adding typing and
        encryption.
      - >-
        [wallbox-ble](https://github.com/pgenera/wallbox-ble) attaches EV chargers to
        Home Assistant via Bluetooth proxies.
      - >-
        IPv4 and IPv6 NTP servers in the public pool, served from AMPRNet (44/8).
        Hundreds of RPS of time served.
      - >-
        [sundial-ntp](https://github.com/pgenera/sundial-ntp) is a solar-disciplined NTP
        refclock.
      - >-
        Consoles, monitoring, and alerting for everything at home, from woodstoves to
        furnaces to solar arrays.

