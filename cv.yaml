personal_projects:
  - name: wearvian
    url: https://github.com/pgenera/wearvian
    description: Wear OS phone key for Rivian R1 vehicles
    dates: "2026"
    bullets:
      - >-
        Wear OS app that functions as a Rivian phone key over Bluetooth LE: passive
        entry and drive enable by proximity, plus lock, frunk, liftgate, window, charge
        port, and climate commands.
      - >-
        Reverse engineered the vehicle's phone-key protocol and documented: the pairing
        handshake, the authenticated ranging heartbeat that passive entry actually keys
        on rather than OS-level bonding, AES-GCM command framing, and the status stream
        that drives live lock, closure, charge, and range display.
      - >-
        Wrote `core-crypto`, a standalone Kotlin/JVM module implementing secp256r1,
        ECDH, HKDF-SHA256, HMAC, and AES-GCM command frames, verified against
        known-answer parity tests.
      - "Built for offline operation and key custody. The watch holds no `INTERNET` permission and its private key never leaves the device, with a [companion phone app](https://github.com/pgenera/wearvian-companion) performing the one-time cloud enrollment over the Wear OS Data Layer. "
      - >-
        Power-saving passive mode releases the wake lock and tears down the radio when
        idle, with a hardware-offloaded scan rebuilding the link on approach.

  - name: Home automation and network toys
    dates: ongoing
    bullets:
      - >-
        [wallbox-ble](https://github.com/pgenera/wallbox-ble) attaches EV chargers to
        Home Assistant via bluetooth proxies.
      - >-
        [sundial-ntp](https://github.com/pgenera/sundial-ntp) is a solar-panel
        disciplined NTP refclock.
      - >-
        [mpubsub](https://github.com/pgenera/esphome-mpubsub) implements my [defensive
        publication](https://www.tdcommons.org/dpubs_series/5601) of brokerless
        Publish/Subscribe, and adds typing and encryption.
      - >-
        Linux-routed home network with policy-based routing, one VLAN per resident, and
        an nftables trust-zone ruleset.
      - >-
        Run IPv4 and IPv6 NTP servers in the public pool, served from AMPRNet (44/8)
        address space. Hundreds of RPS of time served.
      - >-
        Built my own consoles, monitoring, and alerting for the systems I own, from
        woodstoves to furnaces to solar arrays.

